name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --release --locked

  python:
    name: pytest (with Neo4j)
    runs-on: ubuntu-22.04
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/testtest12
          NEO4J_dbms_security_procedures_unrestricted: "*"
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testtest12 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create venv + install deps
        run: |
          uv venv --python 3.11 .venv
          . .venv/bin/activate
          uv pip install \
              maturin pytest pytest-asyncio pydantic \
              neo4j openai anthropic langchain-core \
              hypothesis typer

      - name: Build PyO3 extension
        run: |
          . .venv/bin/activate
          maturin develop --release --locked

      - name: Wait for Neo4j
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7474 > /dev/null; then
              echo "Neo4j up"
              exit 0
            fi
            sleep 5
          done
          echo "Neo4j did not become ready"
          exit 1

      - name: pytest
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testtest12
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q --tb=short
